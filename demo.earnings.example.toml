# Earnings drift: every weekday, rate only the stocks below that reported earnings
# since the last run, trade the rating at the next open, exit after hold_days.
# Copy to demo.toml. Run it every weekday before the US open.

broker = "paper"
mode = "earnings"
hold_days = 5
max_analyses_per_run = 5   # free-tier friendly; extra reporters are logged as skipped
risk_pct = 0.5
max_open_positions = 15  # new trades are skipped while 15 are open
max_net_positions = 8    # ...and while longs and shorts are 8 apart in the same direction
no_short = []            # symbols that cannot be shorted (hard to borrow)
mild_size = 0.5         # Overweight/Underweight trade half the risk of Buy/Sell (0 = skip them)
atr_mult = 2.0
paper_spread_bps = 5
paper_borrow_bps_per_year = 300   # short-selling fee, 3% a year (0 to turn off)
retry_days = 2             # a stock that fails (e.g. rate limit) is retried for 2 trading days

# Optional outputs:
# notes_dir = "C:/Brain/outputs/trading-demo"   # one Markdown note per day + scorecard
# notify_command = "hermes send --to telegram --quiet"   # gets the run summary on stdin

# 50 large, liquid US stocks across sectors (edit freely).
universe = [
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "AVGO", "ORCL", "AMD",
  "NFLX", "CRM", "ADBE", "INTC", "QCOM", "CSCO", "IBM", "UBER", "SHOP", "PLTR",
  "JPM", "BAC", "GS", "MS", "V", "MA", "PYPL", "AXP", "BLK", "C",
  "UNH", "LLY", "JNJ", "PFE", "MRK", "ABBV", "TMO", "XOM", "CVX", "COP",
  "WMT", "COST", "HD", "MCD", "NKE", "SBUX", "KO", "PEP", "DIS", "BA",
]

# Free: Google's Gemini free tier (GOOGLE_API_KEY in .env, 15 requests/minute).
# With a ChatGPT Plus/Pro plan instead (no key; sign in once with
# `tradingagents login chatgpt`), use:
#   llm_provider = "chatgpt"
#   quick_think_llm = "gpt-6-luna"
#   deep_think_llm = "gpt-6-sol"
# and raise max_analyses_per_run to 10. Runs count toward the plan's usage limits.
[llm]
llm_provider = "google"
quick_think_llm = "gemini-3.1-flash-lite"
deep_think_llm = "gemini-3.5-flash-lite"
max_debate_rounds = 1
max_risk_discuss_rounds = 1
