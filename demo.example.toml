# Settings for: python -m tradingagents.demo --config demo.toml run
# Copy to demo.toml and edit. Every key is optional.
# Free setup: built-in paper account on Yahoo prices + Google's free Gemini tier.

broker = "paper"        # "paper" (free, no signup) or "oanda" (OANDA practice account)
mode = "watchlist"      # rate every instrument each run; see demo.earnings.example.toml for earnings mode
risk_pct = 0.5          # % of account lost if a stop is hit
atr_mult = 2.0          # stop distance = 2 x daily ATR(14)
max_drawdown_pct = 10.0 # stop opening new trades after a 10% fall from the starting balance
paper_spread_bps = 5    # spread the paper account charges per round trip (0.05%)

# Any Yahoo symbol: stocks, ETFs, crypto (BTC-USD), forex (EURUSD=X; P&L counted in the
# quote currency, so keep to xxxUSD pairs). TradingAgents' analysts know stocks best.
instruments = ["QQQ", "GLD", "NVDA", "BTC-USD"]

# For OANDA instead: broker = "oanda", and map OANDA name -> analysed ticker:
# [instruments]
# NAS100_USD = "QQQ"
# XAU_USD = "GLD"
# BCO_USD = "BNO"

# Free LLM: a Google AI Studio key (GOOGLE_API_KEY in .env). The free tier limits
# requests per minute and per day; each full analysis is roughly 20-40 requests.
[llm]
llm_provider = "google"
quick_think_llm = "gemini-3.1-flash-lite"
deep_think_llm = "gemini-3.5-flash-lite"
max_debate_rounds = 1
max_risk_discuss_rounds = 1
# Fully local and free instead (needs a capable PC): install Ollama, pull a model, then
# llm_provider = "ollama", quick_think_llm = deep_think_llm = "<model name>"
