# Multi-market desk v1 (docs/multi-market-desk-v1.md): WTI research desk. Research cards and paper
# tracking only: never a real alert, no news check, no model calls, no orders. Service: brent-market@wti.
instrument = "WTICO_USD"
display_name = "WTI"
research_only = true
alerts_enabled = false
info_alerts = false
watch_alerts = false
research_call_cap = 3
price_decimals = 3
max_spread = 0.08
max_quote_age_seconds = 30
range_low = 30.0
range_high = 200.0
blackouts = ["2 10:15-10:45"]
eia_family = true
financing_pct_year = 45.0
notify_command = "hermes send --to telegram --quiet"
journal_dir = "~/.tradingagents/markets/wti"
